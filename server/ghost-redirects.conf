# Server-level redirects, included inside the saadiq.xyz server block.

# Astro's build.format 'file' emits /about.html etc., and try_files serves both
# /about and /about.html, so every page had a duplicate URL. Send the .html form
# to the clean one the canonical tags already name. Match on $request_uri, the
# URI the client sent, so the index directive's internal redirect of / to
# /index.html can't loop. Only top-level pages: /notes/ and /reports/ files are
# shared by their .html URLs. /404.html is excluded so nothing gets redirected
# to /404, which try_files still resolves to the error page with a 200.
if ($request_uri ~ ^/index\.html(?:\?|$)) {
    return 301 /$is_args$args;
}
if ($request_uri ~ ^/(?!404\.html)([^/?]+)\.html(?:\?|$)) {
    return 301 /$1$is_args$args;
}

# Conference landing pages. QR codes on printed merch point at /events/<name>,
# so a retired page should land somewhere useful instead of 404ing, which lets
# old event pages be deleted. ^~ keeps the Ghost slug regex below from
# matching. 302, not 301, so browsers don't cache the redirect and a page can
# come back. ?from=events lets the homepage say the event page has ended. The
# server-level .html redirect above only covers top-level pages, so the
# /events/<name>.html duplicate is handled here.
location ^~ /events/ {
    if ($request_uri ~ ^/events/([^?]+)\.html(?:\?|$)) {
        return 301 /events/$1$is_args$args;
    }
    # Mirror location / so /events/outliers/ doesn't fall through to the 302.
    rewrite ^/events/(.+)/$ /events/$1 permanent;
    try_files $uri $uri.html @events_fallback;

    # add_header in location / doesn't reach this block, so repeat its headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
}
# Any query string (a QR code's utm tags) carries through after the marker.
location @events_fallback {
    if ($args) {
        return 302 /?from=events&$args;
    }
    return 302 /?from=events;
}

# Stable short URL printed on merch and behind its QR codes. 302 so it can be
# repointed at the next event: change $current_event and nothing else. The utm
# tags let PostHog and Ghost tell merch traffic from other visits; anything
# already on the query string carries through after them.
location ~ ^/hi/?$ {
    set $current_event /events/outliers;
    set $hi_tags utm_source=hi&utm_medium=merch&utm_campaign=outliers-2026;
    if ($args) {
        return 302 $current_event?$hi_tags&$args;
    }
    return 302 $current_event?$hi_tags;
}

# Ghost post slug redirects
# Redirects known Ghost post slugs to /newsletter/<slug>/
# Handles both /slug and /slug/ variants via the /?$ pattern

