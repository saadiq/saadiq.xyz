<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Deck Was the Easy Part — Cover (path)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --muted: #6a6a64;
      --accent: #d4a843;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: 0 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .kicker {
      position: relative;
      z-index: 2;
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .path {
      position: relative;
      z-index: 2;
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 52px;
      letter-spacing: 0.01em;
      color: var(--text);
      white-space: nowrap;
    }

    .path .sep { color: var(--muted); padding: 0 0.45em; }

    .resolve {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      gap: 22px;
    }

    .resolve .arrow {
      font-family: var(--font-mono);
      font-size: 56px;
      color: var(--muted);
      line-height: 1;
    }

    .resolve .story {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 168px;
      line-height: 0.9;
      letter-spacing: 0.005em;
      color: var(--accent);
    }

    .resolve .cursor {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 96px;
      color: var(--accent);
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="kicker">// everything in reach</div>
    <div class="path">writing.md<span class="sep">&middot;</span>research/<span class="sep">&middot;</span>brand/<span class="sep">&middot;</span>slides.html</div>
    <div class="resolve">
      <span class="arrow">&#8627;</span>
      <span class="story">story</span><span class="cursor">_</span>
    </div>
  </div>
</body>
</html>
