<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Deck Was the Easy Part — Cover (orbit)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --muted: #6a6a64;
      --accent: #d4a843;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: 0 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .assets {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 84px;
    }

    .asset {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .asset .token {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 40px;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .asset .tick {
      font-family: var(--font-mono);
      font-size: 30px;
      line-height: 1;
      color: var(--accent);
    }

    .hero {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    .hero .story {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 196px;
      line-height: 0.86;
      letter-spacing: 0.005em;
      color: var(--text);
    }

    .hero .cursor {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 110px;
      color: var(--accent);
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="assets">
      <div class="asset"><span class="token">writing.md</span><span class="tick">&#8595;</span></div>
      <div class="asset"><span class="token">research/</span><span class="tick">&#8595;</span></div>
      <div class="asset"><span class="token">brand/</span><span class="tick">&#8595;</span></div>
      <div class="asset"><span class="token">slides.html</span><span class="tick">&#8595;</span></div>
    </div>
    <div class="hero">
      <span class="story">story</span><span class="cursor">_</span>
    </div>
  </div>
</body>
</html>
