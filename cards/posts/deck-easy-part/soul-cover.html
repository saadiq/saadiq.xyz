<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Deck Was the Easy Part — Cover (soul)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --muted: #6a6a64;
      --soft: #9a948a;
      --accent: #d4a843;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: 0 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 80px;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .beat { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 18px; }

    .soul .word {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 188px;
      line-height: 0.88;
      letter-spacing: 0.005em;
      color: var(--accent);
    }

    .artifact .word {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 58px;
      letter-spacing: 0.01em;
      color: var(--soft);
    }

    .label {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 23px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .soul .label { color: var(--accent); }

    .bridge {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .bridge .glyph {
      font-family: var(--font-mono);
      font-size: 64px;
      color: var(--accent);
      opacity: 0.7;
      line-height: 1;
    }

    .bridge .contrib {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 24px;
      letter-spacing: 0.06em;
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="beat soul">
      <span class="word">story</span>
      <span class="label">what i bring</span>
    </div>
    <div class="bridge">
      <span class="glyph">&#10230;</span>
      <span class="contrib">writing &middot; research &middot; brand</span>
    </div>
    <div class="beat artifact">
      <span class="word">deck.html</span>
      <span class="label">the easy part</span>
    </div>
  </div>
</body>
</html>
