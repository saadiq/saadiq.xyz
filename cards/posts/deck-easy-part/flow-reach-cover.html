<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Deck Was the Easy Part — Cover (flow + in reach)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --muted: #6a6a64;
      --soft: #9a948a;
      --accent: #d4a843;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: 0 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 54px;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .node { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 16px; }

    .driver .word {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 162px;
      line-height: 0.9;
      letter-spacing: 0.005em;
      color: var(--accent);
    }

    .label {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 21px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .arrow {
      position: relative;
      z-index: 2;
      font-family: var(--font-mono);
      font-size: 56px;
      color: var(--accent);
      opacity: 0.7;
      line-height: 1;
    }

    .reach {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      border: 1.5px solid rgba(212, 168, 67, 0.38);
      border-radius: 12px;
      padding: 30px 34px 26px;
    }

    .reach .reach-label {
      position: absolute;
      top: -13px;
      left: 22px;
      background: var(--bg);
      padding: 0 12px;
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .reach .token {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 34px;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .output .word {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 48px;
      letter-spacing: 0.01em;
      color: var(--soft);
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="node driver">
      <span class="word">story</span>
    </div>
    <span class="arrow">&#10230;</span>
    <div class="reach">
      <span class="reach-label">in reach</span>
      <span class="token">writing.md</span>
      <span class="token">research/</span>
      <span class="token">brand/</span>
    </div>
    <span class="arrow">&#10230;</span>
    <div class="node output">
      <span class="word">deck.html</span>
    </div>
  </div>
</body>
</html>
