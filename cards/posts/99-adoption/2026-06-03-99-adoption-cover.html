<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>99% Adoption and Still Stuck — Newsletter Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --muted: #6a6a64;
      --accent: #d4a843;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: 0 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .kicker {
      position: relative;
      z-index: 2;
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 27px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .stats {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 96px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .stat .num {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 210px;
      line-height: 0.9;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .stat .label {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 27px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat.result .label { color: var(--accent); }

    .divider {
      width: 2px;
      height: 210px;
      background: linear-gradient(180deg, transparent, #2c2c29 22%, #2c2c29 78%, transparent);
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="stats">
      <div class="stat">
        <div class="num">99%</div>
        <div class="label">adoption</div>
      </div>
      <div class="divider"></div>
      <div class="stat result">
        <div class="num">1&times;</div>
        <div class="label">result</div>
      </div>
    </div>
  </div>
</body>
</html>
