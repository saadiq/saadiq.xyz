<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stop Reviewing the Plan — Quote Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --muted: #6a6a64;
      --accent: #d4a843;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px; height: 400px; background: var(--bg);
      position: relative; overflow: hidden; padding: 0 110px;
      display: flex; align-items: center;
    }

    .banner::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .hero {
      position: relative; z-index: 2;
      font-family: var(--font-serif); font-style: italic;
      font-size: 142px; line-height: 1.02;
      letter-spacing: -0.01em; color: var(--text);
    }
    .hero .hl { color: var(--accent); }

    .footer {
      position: absolute; bottom: 38px; right: 90px; z-index: 2;
      font-family: var(--font-mono); font-size: 22px; color: var(--muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="hero">The scarce thing<br>is <span class="hl">not the plan.</span></div>
    <div class="footer">saadiq.xyz</div>
  </div>
</body>
</html>
