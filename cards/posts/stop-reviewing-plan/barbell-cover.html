<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stop Reviewing the Plan — Barbell Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --muted: #6a6a64;
      --accent: #d4a843;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px; height: 400px; background: var(--bg);
      position: relative; overflow: hidden; padding: 0 110px;
      display: flex; align-items: center; justify-content: center;
    }

    .banner::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .row {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      gap: 44px; width: 100%;
    }

    .end { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .end .word {
      font-family: var(--font-serif); font-style: italic;
      font-size: 100px; line-height: 0.95; color: var(--accent);
      white-space: nowrap;
    }
    .end .kick {
      font-family: var(--font-mono); font-weight: 500; font-size: 23px;
      letter-spacing: 0.34em; text-transform: uppercase; color: var(--muted);
    }

    .arrow {
      font-family: var(--font-mono); font-weight: 400; font-size: 64px;
      color: var(--accent); line-height: 1; flex-shrink: 0;
    }

    .mid { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .mid .word {
      font-family: var(--font-serif); font-size: 82px; line-height: 0.95;
      color: var(--muted);
      text-decoration: line-through; text-decoration-color: #55524a;
      text-decoration-thickness: 5px;
      white-space: nowrap;
    }
    .mid .kick {
      font-family: var(--font-mono); font-weight: 400; font-size: 21px;
      letter-spacing: 0.3em; text-transform: uppercase; color: #55524a;
    }

    .footer {
      position: absolute; bottom: 38px; right: 90px; z-index: 2;
      font-family: var(--font-mono); font-size: 22px; color: var(--muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="row">
      <div class="end">
        <div class="word">the problem</div>
        <div class="kick">upstream</div>
      </div>
      <div class="arrow">&larr;</div>
      <div class="mid">
        <div class="word">the plan</div>
        <div class="kick">cheap now</div>
      </div>
      <div class="arrow">&rarr;</div>
      <div class="end">
        <div class="word">the build system</div>
        <div class="kick">downstream</div>
      </div>
    </div>
    <div class="footer">saadiq.xyz</div>
  </div>
</body>
</html>
