<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg:#0c0c0c; --text:#f0ece4; --text-muted:#ac9e90; --accent:#d4a843; --rule:#2a2a2a; }
    body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
    .banner { width:1900px; height:400px; background:var(--bg); position:relative; overflow:hidden; }
    .banner::before { content:""; position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0.04;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat:repeat; background-size:200px 200px; }
    .glow { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:900px; height:460px;
      background:radial-gradient(ellipse, rgba(212,168,67,0.09) 0%, transparent 64%); z-index:1; }
    .art { position:absolute; inset:0; z-index:2; }
    .corner { position:absolute; width:30px; height:30px; z-index:3; }
    .corner-tr { top:22px; right:22px; border-top:1px solid var(--rule); border-right:1px solid var(--rule); }
    .corner-br { bottom:22px; right:22px; border-bottom:1px solid var(--rule); border-right:1px solid var(--rule); }
  </style>
</head>
<body>
  <div class="banner">
    <div class="glow"></div>
    <svg class="art" viewBox="0 0 1900 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="nodeGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="10" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- single faint orbit ring -->
      <circle cx="950" cy="200" r="170" fill="none" stroke="#f0ece4" stroke-opacity="0.11" stroke-width="1.2"/>

      <!-- faint spokes from hub to a few outputs -->
      <g stroke="#f0ece4" stroke-opacity="0.10" stroke-width="1">
        <line x1="950" y1="200" x2="1090" y2="98"/>
        <line x1="950" y1="200" x2="1120" y2="262"/>
        <line x1="950" y1="200" x2="788"  y2="120"/>
        <line x1="950" y1="200" x2="812"  y2="296"/>
        <line x1="950" y1="200" x2="1135" y2="180"/>
      </g>

      <!-- output nodes (spokes), one gold -->
      <g fill="#f0ece4">
        <circle cx="1090" cy="98"  r="5" opacity="0.5"/>
        <circle cx="1120" cy="262" r="5" opacity="0.45"/>
        <circle cx="788"  cy="120" r="4.5" opacity="0.42"/>
        <circle cx="812"  cy="296" r="4.5" opacity="0.4"/>
      </g>
      <circle cx="1135" cy="180" r="5.5" fill="#d4a843" opacity="0.85"/>

      <!-- the hub: the platform you own -->
      <circle cx="950" cy="200" r="24" fill="none" stroke="#d4a843" stroke-opacity="0.30" stroke-width="1.2"/>
      <circle cx="950" cy="200" r="11" fill="#d4a843" filter="url(#nodeGlow)"/>
    </svg>
    <div class="corner corner-tr"></div>
    <div class="corner corner-br"></div>
  </div>
</body>
</html>
