<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg:#0c0c0c; --text:#f0ece4; --text-muted:#ac9e90; --accent:#d4a843; --rule:#2a2a2a; }
    body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
    .banner { width:1900px; height:400px; background:var(--bg); position:relative; overflow:hidden; }
    .banner::before { content:""; position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0.04;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat:repeat; background-size:200px 200px; }
    .glow { position:absolute; top:50%; left:55%; transform:translate(-50%,-50%); width:1300px; height:460px;
      background:radial-gradient(ellipse, rgba(212,168,67,0.06) 0%, transparent 66%); z-index:1; }
    .art { position:absolute; inset:0; z-index:2; }
    .corner { position:absolute; width:30px; height:30px; z-index:3; }
    .corner-tr { top:22px; right:22px; border-top:1px solid var(--rule); border-right:1px solid var(--rule); }
    .corner-br { bottom:22px; right:22px; border-bottom:1px solid var(--rule); border-right:1px solid var(--rule); }
  </style>
</head>
<body>
  <div class="banner">
    <div class="glow"></div>
    <svg class="art" viewBox="0 0 1900 400" xmlns="http://www.w3.org/2000/svg">
      <!-- dispersing output cards, receding right -->
      <g fill="#f0ece4">
        <rect x="455" y="120" width="150" height="160" rx="10" fill-opacity="0.035" stroke="#f0ece4" stroke-opacity="0.42" stroke-width="1.5"/>
        <rect x="665" y="135" width="120" height="130" rx="9"  fill-opacity="0.03"  stroke="#f0ece4" stroke-opacity="0.30" stroke-width="1.4"/>
        <rect x="850" y="148" width="96"  height="104" rx="8"  fill-opacity="0.02"  stroke="#f0ece4" stroke-opacity="0.22" stroke-width="1.3"/>
        <rect x="1010" y="160" width="74" height="80"  rx="7"  fill-opacity="0"     stroke="#f0ece4" stroke-opacity="0.16" stroke-width="1.2"/>
        <rect x="1150" y="170" width="56" height="60"  rx="6"  fill-opacity="0"     stroke="#f0ece4" stroke-opacity="0.11" stroke-width="1.1"/>
        <rect x="1272" y="178" width="42" height="44"  rx="5"  fill-opacity="0"     stroke="#f0ece4" stroke-opacity="0.08" stroke-width="1"/>
        <rect x="1376" y="185" width="30" height="30"  rx="4"  fill-opacity="0"     stroke="#f0ece4" stroke-opacity="0.06" stroke-width="1"/>
        <circle cx="1470" cy="200" r="4" opacity="0.05"/>
        <circle cx="1545" cy="200" r="3" opacity="0.035"/>
      </g>

      <!-- the source: a written long-form document -->
      <rect x="160" y="70" width="205" height="260" rx="12" fill="#d4a843" fill-opacity="0.05" stroke="#d4a843" stroke-opacity="0.8" stroke-width="1.8"/>
      <g stroke-linecap="round">
        <line x1="190" y1="112" x2="300" y2="112" stroke="#d4a843" stroke-opacity="0.85" stroke-width="5"/>
        <line x1="190" y1="150" x2="335" y2="150" stroke="#f0ece4" stroke-opacity="0.30" stroke-width="3"/>
        <line x1="190" y1="176" x2="335" y2="176" stroke="#f0ece4" stroke-opacity="0.30" stroke-width="3"/>
        <line x1="190" y1="202" x2="335" y2="202" stroke="#f0ece4" stroke-opacity="0.30" stroke-width="3"/>
        <line x1="190" y1="228" x2="335" y2="228" stroke="#f0ece4" stroke-opacity="0.30" stroke-width="3"/>
        <line x1="190" y1="254" x2="335" y2="254" stroke="#f0ece4" stroke-opacity="0.30" stroke-width="3"/>
        <line x1="190" y1="280" x2="290" y2="280" stroke="#f0ece4" stroke-opacity="0.30" stroke-width="3"/>
      </g>
    </svg>
    <div class="corner corner-tr"></div>
    <div class="corner corner-br"></div>
  </div>
</body>
</html>
