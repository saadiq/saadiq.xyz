<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Content Engine — cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --text-muted: #ac9e90;
      --accent: #d4a843;
      --rule: #2a2a2a;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* Noise texture */
    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px 200px;
    }

    /* Ambient glow behind the fan */
    .glow {
      position: absolute;
      top: 50%;
      left: 62%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 460px;
      background: radial-gradient(ellipse, rgba(212, 168, 67, 0.07) 0%, transparent 66%);
      z-index: 1;
    }

    .art {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    /* Subtle right-corner marks, matching house covers */
    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      z-index: 3;
    }
    .corner-tr { top: 22px; right: 22px; border-top: 1px solid var(--rule); border-right: 1px solid var(--rule); }
    .corner-br { bottom: 22px; right: 22px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); }
  </style>
</head>
<body>
  <div class="banner">
    <div class="glow"></div>

    <svg class="art" viewBox="0 0 1900 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Cream lines fade as they travel from the node outward -->
        <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="500" y1="0" x2="1830" y2="0">
          <stop offset="0"   stop-color="#f0ece4" stop-opacity="0.55"/>
          <stop offset="1"   stop-color="#f0ece4" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="500" y1="0" x2="1840" y2="0">
          <stop offset="0"   stop-color="#d4a843" stop-opacity="0.95"/>
          <stop offset="1"   stop-color="#d4a843" stop-opacity="0.14"/>
        </linearGradient>
        <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- The fan: one source becomes many outputs -->
      <g fill="none" stroke="url(#cream)" stroke-width="1.6">
        <line x1="500" y1="200" x2="1800" y2="64"/>
        <line x1="500" y1="200" x2="1760" y2="118"/>
        <line x1="500" y1="200" x2="1820" y2="158"/>
        <line x1="500" y1="200" x2="1800" y2="246"/>
        <line x1="500" y1="200" x2="1760" y2="286"/>
        <line x1="500" y1="200" x2="1800" y2="338"/>
      </g>
      <!-- Central gold ray -->
      <line x1="500" y1="200" x2="1840" y2="200" stroke="url(#gold)" stroke-width="2"/>

      <!-- Output terminals -->
      <g fill="#f0ece4">
        <circle cx="1800" cy="64"  r="3" opacity="0.30"/>
        <circle cx="1760" cy="118" r="3" opacity="0.30"/>
        <circle cx="1820" cy="158" r="3" opacity="0.30"/>
        <circle cx="1800" cy="246" r="3" opacity="0.30"/>
        <circle cx="1760" cy="286" r="3" opacity="0.30"/>
        <circle cx="1800" cy="338" r="3" opacity="0.30"/>
      </g>
      <circle cx="1840" cy="200" r="3.5" fill="#d4a843" opacity="0.7"/>

      <!-- The source node -->
      <circle cx="500" cy="200" r="13" fill="none" stroke="#d4a843" stroke-width="1.2" opacity="0.35"/>
      <circle cx="500" cy="200" r="6.5" fill="#d4a843" filter="url(#nodeGlow)"/>
    </svg>

    <div class="corner corner-tr"></div>
    <div class="corner corner-br"></div>
  </div>
</body>
</html>
