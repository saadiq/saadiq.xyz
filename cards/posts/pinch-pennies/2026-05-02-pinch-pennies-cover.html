<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't pinch pennies on your AI sub — Newsletter Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --accent: #d4a843;
      --in-bar: #f0ece4;

      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    body {
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: 0 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .chart {
      display: flex;
      flex-direction: column;
      gap: 36px;
      z-index: 2;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .bar {
      height: 60px;
    }

    .bar-in {
      width: 160px;
      background: var(--in-bar);
    }

    .bar-out {
      width: 1600px;
      background: var(--accent);
    }

    .amt {
      font-family: var(--font-mono);
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text);
      white-space: nowrap;
    }

    .amt-out {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="chart">
      <div class="row">
        <div class="bar bar-in"></div>
        <div class="amt">$1 in</div>
      </div>
      <div class="row">
        <div class="bar bar-out"></div>
        <div class="amt amt-out">$10 back</div>
      </div>
    </div>
  </div>
</body>
</html>
