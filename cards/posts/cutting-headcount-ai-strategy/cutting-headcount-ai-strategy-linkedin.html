<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Same output. Fewer manual steps. Same company.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #f3f1ed;
      --ink: #242522;
      --muted: #77766f;
      --ochre: #be8a20;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "JetBrains Mono", monospace;
    }

    .card {
      align-items: stretch;
      background:
        radial-gradient(circle at 80% 15%, rgb(190 138 32 / 5%), transparent 28%),
        linear-gradient(rgb(255 255 255 / 24%), rgb(255 255 255 / 24%)),
        var(--paper);
      display: flex;
      flex-direction: column;
      height: 2000px;
      overflow: hidden;
      padding: 112px 108px 92px;
      position: relative;
      width: 1600px;
    }

    .card::before {
      background-image:
        linear-gradient(rgb(36 37 34 / 3%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(36 37 34 / 3%) 1px, transparent 1px);
      background-size: 40px 40px;
      content: "";
      inset: 0;
      mask-image: linear-gradient(to bottom, black, transparent 55%);
      opacity: 0.45;
      pointer-events: none;
      position: absolute;
    }

    .eyebrow {
      color: var(--ochre);
      font-size: 29px;
      font-weight: 500;
      letter-spacing: 0.14em;
      position: relative;
      text-transform: uppercase;
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 164px;
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 0.91;
      margin-top: 64px;
      max-width: 1320px;
      position: relative;
    }

    h1 .accent {
      color: var(--ochre);
    }

    .diagram {
      align-items: center;
      display: flex;
      flex: 1;
      margin: 28px -80px 18px;
      position: relative;
    }

    .diagram img {
      display: block;
      filter: contrast(1.02);
      height: auto;
      mix-blend-mode: multiply;
      width: 100%;
    }

    .rule {
      background: var(--ink);
      height: 2px;
      opacity: 0.22;
      position: relative;
      width: 100%;
    }

    .footer {
      align-items: center;
      color: var(--muted);
      display: flex;
      font-size: 27px;
      justify-content: space-between;
      letter-spacing: 0.035em;
      padding-top: 34px;
      position: relative;
    }

    .footer .site {
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Automation without redesign</div>
    <h1>
      Same output.<br>
      <span class="accent">Fewer manual steps.</span><br>
      Same company.
    </h1>
    <div class="diagram">
      <img
        src="file:///Users/saadiq/Library/Mobile%20Documents/iCloud~md~obsidian/Documents/Obsidian%20Vault/_attachments/2026-07-22-cutting-headcount-is-not-an-ai-strategy-cover-concept-v4.png"
        alt=""
      >
    </div>
    <div class="rule"></div>
    <footer class="footer">
      <span>Saadiq Rodgers-King</span>
      <span class="site">saadiq.xyz</span>
    </footer>
  </main>
</body>
</html>
