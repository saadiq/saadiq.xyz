<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You don't need to know what an agent is — Newsletter Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --text: #f0ece4;
      --accent: #d4a843;

      --font-serif: "Instrument Serif", Georgia, serif;
    }

    body {
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1900px;
      height: 400px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1400px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(212, 168, 67, 0.08) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 168px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
      display: flex;
      align-items: baseline;
      gap: 0.32em;
    }

    .hero .op {
      color: var(--accent);
      font-style: normal;
      font-family: var(--font-serif);
      font-size: 0.78em;
      transform: translateY(-0.04em);
    }

    .hero .cursor {
      display: inline-block;
      width: 6px;
      height: 110px;
      background: var(--accent);
      margin-left: 14px;
      align-self: center;
      transform: translateY(6px);
      box-shadow: 0 0 12px rgba(212, 168, 67, 0.4);
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="glow"></div>

    <div class="hero">
      <span>agent</span>
      <span class="op">=</span>
      <span>context</span>
      <span class="op">+</span>
      <span>tools</span>
      <span class="cursor"></span>
    </div>
  </div>
</body>
</html>
